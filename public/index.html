<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatCraftPro Web Edition</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #121216; color: #e1e1e6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Üst Durum Çubuğu (ChatCraftPro Header) */
        .ccp-header { background: #1a1a24; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a3c; font-size: 13px; }
        .ccp-header select, .ccp-header input { background: #242433; color: #fff; border: 1px solid #3a3a52; padding: 5px 10px; border-radius: 6px; }

        /* Ana İçerik Ekranları */
        .ccp-content { flex: 1; position: relative; overflow: hidden; display: flex; }
        .tab-pane { position: absolute; inset: 0; display: none; flex-direction: column; background: #121216; padding: 10px; gap: 10px; overflow-y: auto; }
        .tab-pane.active { display: flex; }

        /* Alt Sekme Çubuğu (ChatCraftPro Bottom Bar) */
        .ccp-nav { height: 60px; background: #1a1a24; border-top: 1px solid #2a2a3c; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { background: none; border: none; color: #8e8e99; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: 1; }
        .nav-item.active { color: #6366f1; font-weight: bold; }
        .nav-item span.icon { font-size: 18px; }

        /* Konsol & Sohbet */
        .logs-box { flex: 1; background: #0c0c10; border: 1px solid #2a2a3c; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; color: #34d399; overflow-y: auto; line-height: 1.4; }
        .chat-box-row { display: flex; gap: 8px; }
        .chat-box-row input { flex: 1; background: #1a1a24; border: 1px solid #3a3a52; color: #fff; padding: 10px; border-radius: 8px; }
        .chat-box-row button { background: #6366f1; color: #fff; border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; }

        /* Oyuncu Listesi & NPC */
        .list-item { background: #1a1a24; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border: 1px solid #2a2a3c; font-size: 13px; }

        /* Envanter */
        .inventory-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; background: #1a1a24; padding: 10px; border-radius: 8px; justify-content: center; }
        .mc-slot { aspect-ratio: 1; background: #2a2a3c; border: 1px solid #3a3a52; border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .mc-slot img { width: 80%; height: 80%; image-rendering: pixelated; }
        .slot-count { position: absolute; bottom: 1px; right: 3px; font-size: 10px; font-weight: bold; color: #fff; text-shadow: 1px 1px #000; }

        /* Kontroller & D-Pad */
        .control-group { background: #1a1a24; padding: 12px; border-radius: 8px; border: 1px solid #2a2a3c; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px; }
        .dpad-btn { background: #2a2a3c; color: #fff; border: 1px solid #3a3a52; border-radius: 6px; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .dpad-btn:active { background: #6366f1; }
        .action-row { display: flex; gap: 6px; width: 100%; }
        .action-row button { flex: 1; background: #2a2a3c; color: #fff; border: 1px solid #3a3a52; padding: 8px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .action-row button:active { background: #10b981; }

        /* Radar Canvas */
        #radarCanvas { background: #0c0c10; border-radius: 8px; border: 1px solid #2a2a3c; display: block; margin: 0 auto; }
        
        .panel-section-title { font-size: 11px; text-transform: uppercase; color: #8e8e99; font-weight: bold; margin-bottom: 4px; }
    </style>
</head>
<body>

    <!-- ÜST BAĞLANTI ÇUBUĞU -->
    <div class="ccp-header">
        <div style="display: flex; gap: 6px; align-items: center;">
            <input type="text" id="host" placeholder="IP Adresi" style="width: 110px;">
            <input type="number" id="port" value="25565" style="width: 65px;">
            <input type="text" id="username" placeholder="BotAdı" style="width: 80px;">
            <select id="version" style="width: 75px;">
                <option value="1.21.11">1.21.11</option>
                <option value="false">Auto</option>
            </select>
        </div>
        <div style="display: flex; gap: 5px;">
            <button onclick="startBot()" style="background:#10b981; color:#fff; border:none; padding:5px 10px; border-radius:6px; font-weight:bold;">Bağlan</button>
            <button onclick="stopBot()" style="background:#ef4444; color:#fff; border:none; padding:5px 10px; border-radius:6px; font-weight:bold;">Kopar</button>
        </div>
    </div>

    <!-- ORTA İÇERİK SEKME ALANI -->
    <div class="ccp-content">
        
        <!-- 1. KONSOL / SOHBET -->
        <div id="tab-console" class="tab-pane active">
            <div class="logs-box" id="logs">
                <div>[Sistem] ChatCraftPro arayüzü yüklendi. Bot bekleniyor...</div>
            </div>
            <div class="chat-box-row">
                <input type="text" id="chatMsg" placeholder="Mesaj veya komut yaz (/spawn, /home...)" onkeypress="if(event.key==='Enter')sendChat()">
                <button onclick="sendChat()">Gönder</button>
            </div>
        </div>

        <!-- 2. OYUNCU LİSTESİ -->
        <div id="tab-players" class="tab-pane">
            <div class="panel-section-title">Çevrimiçi Oyuncular</div>
            <div id="playersListContainer" style="flex:1; overflow-y:auto;">
                <div style="text-align:center; color:#666; margin-top:20px;">Aktif oyuncu yok</div>
            </div>
        </div>

        <!-- 3. ENVANTER & SANDIK -->
        <div id="tab-inventory" class="tab-pane">
            <div class="panel-section-title">Bot Envanteri</div>
            <div class="inventory-grid" id="playerInvGrid"></div>
            
            <div id="mcGuiContainer" style="display:none; margin-top:10px;">
                <div class="panel-section-title" id="mcGuiTitle">Açık Sandık / Menü</div>
                <div class="inventory-grid" id="mcGuiGrid"></div>
            </div>
            <button onclick="requestRefreshInv()" style="background:#3b82f6; color:#fff; border:none; padding:8px; border-radius:8px; margin-top:10px; font-weight:bold;">Envanteri Yenile</button>
        </div>

        <!-- 4. RADAR & HARİTA -->
        <div id="tab-map" class="tab-pane">
            <div class="panel-section-title">Canlı Çevre Radarı</div>
            <canvas id="radarCanvas" width="280" height="200"></canvas>
            <div style="flex:1; overflow-y:auto; margin-top:10px;">
                <div class="panel-section-title">Yakındaki Varlıklar / NPC'ler</div>
                <div id="npcList"></div>
            </div>
        </div>

        <!-- 5. KONTROLLER & PATHFINDER -->
        <div id="tab-controls" class="tab-pane">
            <div class="control-group">
                <div class="panel-section-title">Yol Bulma (Pathfinder)</div>
                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; width:100%;">
                    <input type="number" id="targetX" placeholder="X" style="background:#1a1a24; border:1px solid #3a3a52; color:#fff; padding:6px; border-radius:6px; text-align:center;">
                    <input type="number" id="targetY" placeholder="Y" style="background:#1a1a24; border:1px solid #3a3a52; color:#fff; padding:6px; border-radius:6px; text-align:center;">
                    <input type="number" id="targetZ" placeholder="Z" style="background:#1a1a24; border:1px solid #3a3a52; color:#fff; padding:6px; border-radius:6px; text-align:center;">
                </div>
                <div style="display:flex; gap:6px; width:100%;">
                    <button onclick="goToCoords()" style="background:#10b981; color:#fff; border:none; padding:8px; border-radius:6px; flex:2; font-weight:bold;">Oraya Yürü 🧭</button>
                    <button onclick="stopWalk()" style="background:#ef4444; color:#fff; border:none; padding:8px; border-radius:6px; flex:1; font-weight:bold;">Dur 🛑</button>
                </div>
            </div>

            <div class="control-group" style="align-items: center;">
                <div class="panel-section-title">Hareket D-Pad</div>
                <div class="dpad">
                    <div></div>
                    <button class="dpad-btn" ontouchstart="sendControl('forward', true)" ontouchend="sendControl('forward', false)" onmousedown="sendControl('forward', true)" onmouseup="sendControl('forward', false)">⬆️</button>
                    <div></div>
                    <button class="dpad-btn" ontouchstart="sendControl('left', true)" ontouchend="sendControl('left', false)" onmousedown="sendControl('left', true)" onmouseup="sendControl('left', false)">⬅️</button>
                    <div class="dpad-btn" style="background:none; border:none;">🎮</div>
                    <button class="dpad-btn" ontouchstart="sendControl('right', true)" ontouchend="sendControl('right', false)" onmousedown="sendControl('right', true)" onmouseup="sendControl('right', false)">➡️</button>
                    <div></div>
                    <button class="dpad-btn" ontouchstart="sendControl('back', true)" ontouchend="sendControl('back', false)" onmousedown="sendControl('back', true)" onmouseup="sendControl('back', false)">⬇️</button>
                    <div></div>
                </div>
                <div class="action-row">
                    <button ontouchstart="sendControl('jump', true)" ontouchend="sendControl('jump', false)" onmousedown="sendControl('jump', true)" onmouseup="sendControl('jump', false)">Zıpla</button>
                    <button ontouchstart="sendControl('sneak', true)" ontouchend="sendControl('sneak', false)" onmousedown="sendControl('sneak', true)" onmouseup="sendControl('sneak', false)">Eğil</button>
                    <button ontouchstart="sendControl('sprint', true)" ontouchend="sendControl('sprint', false)" onmousedown="sendControl('sprint', true)" onmouseup="sendControl('sprint', false)">Koş</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ALT SEKME MENÜSÜ (ChatCraftPro Navigation) -->
    <div class="ccp-nav">
        <button class="nav-item active" onclick="switchTab('console', this)"><span class="icon">💬</span>Sohbet</button>
        <button class="nav-item" onclick="switchTab('players', this)"><span class="icon">👥</span>Oyuncular</button>
        <button class="nav-item" onclick="switchTab('inventory', this)"><span class="icon">🎒</span>Envanter</button>
        <button class="nav-item" onclick="switchTab('map', this)"><span class="icon">🗺️</span>Harita</button>
        <button class="nav-item" onclick="switchTab('controls', this)"><span class="icon">🎮</span>Kontrol</button>
    </div>

    <script>
        const socket = io();
        let currentBot = "";

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            if(el) el.classList.add('active');
        }

        function startBot() {
            const data = {
                host: document.getElementById('host').value,
                port: document.getElementById('port').value,
                username: document.getElementById('username').value,
                version: document.getElementById('version').value
            };
            if(!data.host || !data.username) return alert("IP ve Bot adı zorunludur!");
            currentBot = data.username;
            socket.emit('startBot', data);
        }

        function stopBot() {
            if(currentBot) socket.emit('stopBot', currentBot);
        }

        function sendChat() {
            const msg = document.getElementById('chatMsg').value;
            if(msg && currentBot) {
                socket.emit('sendChat', { username: currentBot, message: msg });
                document.getElementById('chatMsg').value = '';
            }
        }

        function sendControl(action, state) {
            if(currentBot) socket.emit('botControl', { username: currentBot, action, state });
        }

        function goToCoords() {
            if(!currentBot) return;
            const x = document.getElementById('targetX').value;
            const y = document.getElementById('targetY').value;
            const z = document.getElementById('targetZ').value;
            if(x && z) socket.emit('goToCoordinates', { username: currentBot, x, y: y || 64, z });
        }

        function stopWalk() {
            if(currentBot) socket.emit('stopWalking', currentBot);
        }

        function requestRefreshInv() {
            if(currentBot) socket.emit('requestInventory', currentBot);
        }

        socket.on('log', (msg) => {
            const l = document.getElementById('logs');
            l.innerHTML += `<div>${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        });

        socket.on('chat', (msg) => {
            const l = document.getElementById('logs');
            l.innerHTML += `<div style="color:#fff;">${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        });

        socket.on('dataUpdate', (data) => {
            if(data.username !== currentBot) return;

            // Oyuncu Listesini Güncelle
            const pCont = document.getElementById('playersListContainer');
            pCont.innerHTML = '';
            if(data.players && data.players.length > 0) {
                data.players.forEach(p => {
                    pCont.innerHTML += `<div class="list-item"><span>🟢 ${p.username}</span></div>`;
                });
            } else {
                pCont.innerHTML = '<div style="text-align:center; color:#666; margin-top:20px;">Çevrimiçi oyuncu yok</div>';
            }

            // Radar Çizimi
            const canvas = document.getElementById('radarCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.fillStyle = '#6366f1';
            ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();

            const npcList = document.getElementById('npcList');
            npcList.innerHTML = '';

            data.entities.forEach(ent => {
                const rx = (ent.x - data.botPos.x) * 2;
                const rz = (ent.z - data.botPos.z) * 2;
                const dx = cx + rx;
                const dy = cy + rz;

                if(dx >= 0 && dx <= canvas.width && dy >= 0 && dy <= canvas.height) {
                    ctx.fillStyle = ent.type === 'player' ? '#10b981' : '#f59e0b';
                    ctx.beginPath(); ctx.arc(dx, dy, 3, 0, Math.PI * 2); ctx.fill();
                }

                if(ent.type === 'player' || ent.type === 'mob') {
                    npcList.innerHTML += `
                        <div class="list-item">
                            <span>${ent.name || 'Varlık'}</span>
                            <div style="display:flex; gap:5px;">
                                <button onclick="interactEntity(${ent.id}, 'rightclick')" style="background:#3b82f6; border:none; color:#fff; padding:3px 8px; border-radius:4px; font-size:10px;">Menü</button>
                                <button onclick="interactEntity(${ent.id}, 'leftclick')" style="background:#ef4444; border:none; color:#fff; padding:3px 8px; border-radius:4px; font-size:10px;">Vur</button>
                            </div>
                        </div>
                    `;
                }
            });
        });

        socket.on('playerInventoryUpdate', (data) => {
            if(data.username !== currentBot) return;
            const grid = document.getElementById('playerInvGrid');
            grid.innerHTML = '';
            const textureBaseUrl = "https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/items/";

            data.slots.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = 'mc-slot';
                if(item) {
                    slot.innerHTML = `<img src="${textureBaseUrl}${item.name}.png"><span class="slot-count">${item.count > 1 ? item.count : ''}</span>`;
                }
                slot.onclick = () => socket.emit('quickMoveItem', { username: currentBot, slotId: index });
                slot.oncontextmenu = (e) => { e.preventDefault(); socket.emit('tossItem', { username: currentBot, slotId: index }); };
                grid.appendChild(slot);
            });
        });

        socket.on('mcGuiOpened', (data) => {
            if(data.username !== currentBot) return;
            document.getElementById('mcGuiContainer').style.display = 'block';
            document.getElementById('mcGuiTitle').innerText = data.title;
            const grid = document.getElementById('mcGuiGrid');
            grid.innerHTML = '';
            const textureBaseUrl = "https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/items/";

            data.items.forEach((item) => {
                const slot = document.createElement('div');
                slot.className = 'mc-slot';
                if(item) {
                    slot.innerHTML = `<img src="${textureBaseUrl}${item.name}.png"><span class="slot-count">${item.count > 1 ? item.count : ''}</span>`;
                    slot.onclick = () => socket.emit('clickMcItem', { username: currentBot, slotId: item.slot });
                }
                grid.appendChild(slot);
            });
        });

        window.interactEntity = function(id, action) {
            if(currentBot) socket.emit('interactEntity', { username: currentBot, entityId: id, action });
        };
    </script>
</body>
</html>
