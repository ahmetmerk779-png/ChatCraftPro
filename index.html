<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatCraftPro Mobile</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #121216; color: #f1f1f6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* ChatCraftPro Üst Başlık */
        .ccp-topbar { background: #1a1a24; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #2a2a3c; }
        .ccp-title { font-weight: 700; font-size: 16px; color: #6366f1; display: flex; align-items: center; gap: 6px; }

        /* Ana İçerik Ekranları */
        .ccp-container { flex: 1; position: relative; overflow: hidden; display: flex; }
        .screen { position: absolute; inset: 0; display: none; flex-direction: column; background: #121216; padding: 12px; gap: 10px; overflow-y: auto; }
        .screen.active { display: flex; }

        /* Alt Navigasyon Barı */
        .ccp-navbar { height: 60px; background: #1a1a24; border-top: 1px solid #2a2a3c; display: flex; justify-content: space-around; align-items: center; z-index: 10; }
        .nav-btn { background: none; border: none; color: #8e8e99; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; flex: 1; }
        .nav-btn.active { color: #6366f1; font-weight: bold; }
        .nav-btn span { font-size: 18px; }

        /* Sunucu / Bot Yönetim Kartları */
        .server-card { background: #1a1a24; border: 1px solid #2a2a3c; border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
        .server-name { font-weight: bold; font-size: 14px; color: #fff; }
        
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; color: #94a3b8; font-weight: bold; text-transform: uppercase; }
        input, select { background: #121216; color: #fff; border: 1px solid #3a3a52; padding: 10px; border-radius: 8px; font-size: 13px; outline: none; }
        input:focus { border-color: #6366f1; }

        .btn-primary { background: #6366f1; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; }
        .btn-primary:active { background: #4f46e5; }
        .btn-danger { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }

        /* Konsol / Sohbet */
        .logs-area { flex: 1; background: #0c0c10; border: 1px solid #2a2a3c; border-radius: 10px; padding: 10px; font-family: monospace; font-size: 12px; color: #34d399; overflow-y: auto; line-height: 1.4; }
        .chat-row { display: flex; gap: 8px; }
        .chat-row input { flex: 1; }

        /* Envanter Kutuları */
        .inv-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: #1a1a24; padding: 10px; border-radius: 10px; justify-content: center; border: 1px solid #2a2a3c; }
        .slot { aspect-ratio: 1; background: #242433; border: 1px solid #3a3a52; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .slot img { width: 75%; height: 75%; image-rendering: pixelated; }
        .slot-cnt { position: absolute; bottom: 2px; right: 4px; font-size: 10px; font-weight: bold; color: #fff; text-shadow: 1px 1px #000; }

        /* Kontrol D-Pad */
        .controls-box { background: #1a1a24; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; border: 1px solid #2a2a3c; }
        .dpad-grid { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 4px; }
        .dpad-item { background: #242433; color: #fff; border: 1px solid #3a3a52; border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .dpad-item:active { background: #6366f1; }
        .actions-grid { display: flex; gap: 6px; width: 100%; }
        .actions-grid button { flex: 1; background: #242433; border: 1px solid #3a3a52; color: #fff; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .actions-grid button:active { background: #10b981; }

        .list-row { background: #1a1a24; padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border: 1px solid #2a2a3c; font-size: 13px; }
    </style>
</head>
<body>

    <!-- ÜST BAŞLIK -->
    <div class="ccp-topbar">
        <div class="ccp-title">⚡ ChatCraftPro</div>
        <div id="connectionStatus" style="font-size: 11px; color: #ef4444; font-weight: bold;">● Bağlı Değil</div>
    </div>

    <!-- ORTA EKRANLAR -->
    <div class="ccp-container">
        
        <!-- 1. SUNUCU / BOT YÖNETİM EKRANI -->
        <div id="screen-dashboard" class="screen active">
            <div class="server-card">
                <div class="server-name">🤖 Yeni Bot Bağlantısı</div>
                <div class="form-group">
                    <label>Sunucu IP</label>
                    <input type="text" id="host" placeholder="play.myserver.com" oninput="saveConfig()">
                </div>
                <div style="display: flex; gap: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Port</label>
                        <input type="number" id="port" value="25565" oninput="saveConfig()">
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label>Bot Kullanıcı Adı</label>
                        <input type="text" id="username" placeholder="Bot1" oninput="saveConfig()">
                    </div>
                </div>
                <div class="form-group">
                    <label>Minecraft Sürümü</label>
                    <select id="version" onchange="saveConfig()">
                        <option value="1.21.11">1.21.11</option>
                        <option value="false">Otomatik Algıla</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="startBot()">🚀 Botu Başlat ve Bağlan</button>
                <button class="btn-danger" onclick="stopBot()">🛑 Botu Durdur / Çık</button>
            </div>
            
            <div style="font-size: 11px; color: #94a3b8; text-align: center; margin-top: auto;">
                ChatCraftPro Cloud v2.6 • Mobil Sürüm
            </div>
        </div>

        <!-- 2. CANLI 3D PRISMARINE EKRANI -->
        <div id="screen-viewport" class="screen">
            <div style="flex: 1; background: #000; border-radius: 12px; border: 1px solid #2a2a3c; position: relative; overflow: hidden; display: flex; flex-direction: column;">
                <div style="position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; background: rgba(0,0,0,0.7); padding: 6px 10px; border-radius: 6px; z-index: 5; pointer-events: none;">
                    <span id="hudPos">X: 0 | Y: 64 | Z: 0</span>
                    <span id="hudStats">❤️ 20 | 🍖 20</span>
                </div>
                <iframe id="prismarineFrame" src="" style="width: 100%; height: 100%; border: none; flex: 1;"></iframe>
                <button onclick="refreshViewer()" style="position: absolute; bottom: 10px; right: 10px; background:#3b82f6; color:#fff; border:none; padding:8px 12px; border-radius:8px; font-size:11px; font-weight:bold; cursor:pointer;">3D Ekranı Yenile 🔄</button>
            </div>
        </div>

        <!-- 3. SOHBET / KONSOL -->
        <div id="screen-console" class="screen">
            <div class="logs-area" id="logs">
                <div>[Sistem] ChatCraftPro paneli hazır. Bağlantı bekleniyor...</div>
            </div>
            <div class="chat-row">
                <input type="text" id="chatMsg" placeholder="Sohbet mesajı veya komut yaz..." onkeypress="if(event.key==='Enter')sendChat()">
                <button class="btn-primary" onclick="sendChat()" style="padding: 0 16px;">Gönder</button>
            </div>
        </div>

        <!-- 4. OYUNCU LİSTESİ -->
        <div id="screen-players" class="screen">
            <label>Çevrimiçi Oyuncular</label>
            <div id="playersListContainer" style="flex: 1; overflow-y: auto;">
                <div style="text-align: center; color: #666; margin-top: 30px;">Aktif oyuncu yok</div>
            </div>
        </div>

        <!-- 5. ENVANTER -->
        <div id="screen-inventory" class="screen">
            <label>Bot Envanteri (Sol Tık: Taşı | Sağ Tık: Yere At)</label>
            <div class="inv-grid" id="playerInvGrid"></div>
            
            <div id="mcGuiContainer" style="display:none; margin-top: 10px;">
                <label id="mcGuiTitle">Sandık / Menü</label>
                <div class="inv-grid" id="mcGuiGrid"></div>
            </div>
            <button class="btn-primary" onclick="requestRefreshInv()" style="margin-top: 10px; background: #3b82f6;">Envanteri Yenile 🔄</button>
        </div>

        <!-- 6. KONTROL & RADAR -->
        <div id="screen-controls" class="screen">
            <div class="controls-box">
                <label>Yol Bulma (Pathfinder)</label>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%;">
                    <input type="number" id="targetX" placeholder="X" style="text-align: center;">
                    <input type="number" id="targetY" placeholder="Y" style="text-align: center;">
                    <input type="number" id="targetZ" placeholder="Z" style="text-align: center;">
                </div>
                <div style="display: flex; gap: 6px; width: 100%;">
                    <button class="btn-primary" onclick="goToCoords()" style="flex: 2; background: #10b981;">Oraya Yürü 🧭</button>
                    <button class="btn-danger" onclick="stopWalk()" style="flex: 1;">Dur 🛑</button>
                </div>
            </div>

            <div class="controls-box" style="align-items: center;">
                <label>D-Pad Hareketleri</label>
                <div class="dpad-grid">
                    <div></div>
                    <button class="dpad-item" ontouchstart="sendControl('forward', true)" ontouchend="sendControl('forward', false)" onmousedown="sendControl('forward', true)" onmouseup="sendControl('forward', false)">⬆️</button>
                    <div></div>
                    <button class="dpad-item" ontouchstart="sendControl('left', true)" ontouchend="sendControl('left', false)" onmousedown="sendControl('left', true)" onmouseup="sendControl('left', false)">⬅️</button>
                    <div class="dpad-item" style="background:none; border:none;">🎮</div>
                    <button class="dpad-item" ontouchstart="sendControl('right', true)" ontouchend="sendControl('right', false)" onmousedown="sendControl('right', true)" onmouseup="sendControl('right', false)">➡️</button>
                    <div></div>
                    <button class="dpad-item" ontouchstart="sendControl('back', true)" ontouchend="sendControl('back', false)" onmousedown="sendControl('back', true)" onmouseup="sendControl('back', false)">⬇️</button>
                    <div></div>
                </div>
                <div class="actions-grid">
                    <button ontouchstart="sendControl('jump', true)" ontouchend="sendControl('jump', false)" onmousedown="sendControl('jump', true)" onmouseup="sendControl('jump', false)">Zıpla</button>
                    <button ontouchstart="sendControl('sneak', true)" ontouchend="sendControl('sneak', false)" onmousedown="sendControl('sneak', true)" onmouseup="sendControl('sneak', false)">Eğil</button>
                    <button ontouchstart="sendControl('sprint', true)" ontouchend="sendControl('sprint', false)" onmousedown="sendControl('sprint', true)" onmouseup="sendControl('sprint', false)">Koş</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ALT NAVİGASYON BARı -->
    <div class="ccp-navbar">
        <button class="nav-btn active" onclick="switchScreen('dashboard', this)"><span class="icon">🏠</span>Sunucu</button>
        <button class="nav-btn" onclick="switchScreen('viewport', this)"><span class="icon">🌐</span>3D Ekran</button>
        <button class="nav-btn" onclick="switchScreen('console', this)"><span class="icon">💬</span>Sohbet</button>
        <button class="nav-btn" onclick="switchScreen('players', this)"><span class="icon">👥</span>Oyuncu</button>
        <button class="nav-btn" onclick="switchScreen('inventory', this)"><span class="icon">🎒</span>Envanter</button>
        <button class="nav-btn" onclick="switchScreen('controls', this)"><span class="icon">🎮</span>Kontrol</button>
    </div>

    <script>
        const socket = io();
        let currentBot = "";

        function saveConfig() {
            localStorage.setItem('ccp_host', document.getElementById('host').value);
            localStorage.setItem('ccp_port', document.getElementById('port').value);
            localStorage.setItem('ccp_username', document.getElementById('username').value);
            localStorage.setItem('ccp_version', document.getElementById('version').value);
        }

        window.onload = () => {
            if(localStorage.getItem('ccp_host')) document.getElementById('host').value = localStorage.getItem('ccp_host');
            if(localStorage.getItem('ccp_port')) document.getElementById('port').value = localStorage.getItem('ccp_port');
            if(localStorage.getItem('ccp_username')) document.getElementById('username').value = localStorage.getItem('ccp_username');
            if(localStorage.getItem('ccp_version')) document.getElementById('version').value = localStorage.getItem('ccp_version');
        };

        function switchScreen(screenId, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + screenId).classList.add('active');
            if(el) el.classList.add('active');
        }

        function startBot() {
            const data = {
                host: document.getElementById('host').value,
                port: document.getElementById('port').value,
                username: document.getElementById('username').value,
                version: document.getElementById('version').value
            };
            if(!data.host || !data.username) return alert("IP ve Bot adı zorunludur!");
            currentBot = data.username;
            socket.emit('startBot', data);
            
            document.getElementById('connectionStatus').innerText = "● Bağlanıyor...";
            document.getElementById('connectionStatus').style.color = "#f59e0b";

            setTimeout(() => {
                refreshViewer();
                switchScreen('console', document.querySelectorAll('.nav-btn')[2]);
            }, 2000);
        }

        function stopBot() {
            if(currentBot) socket.emit('stopBot', currentBot);
            document.getElementById('prismarineFrame').src = '';
            document.getElementById('connectionStatus').innerText = "● Bağlı Değil";
            document.getElementById('connectionStatus').style.color = "#ef4444";
        }

        function refreshViewer() {
            const host = window.location.hostname || 'localhost';
            document.getElementById('prismarineFrame').src = `http://${host}:3007`;
        }

        function sendChat() {
            const msg = document.getElementById('chatMsg').value;
            if(msg && currentBot) {
                socket.emit('sendChat', { username: currentBot, message: msg });
                document.getElementById('chatMsg').value = '';
            }
        }

        function sendControl(action, state) {
            if(currentBot) socket.emit('botControl', { username: currentBot, action, state });
        }

        function goToCoords() {
            if(!currentBot) return;
            const x = document.getElementById('targetX').value;
            const y = document.getElementById('targetY').value;
            const z = document.getElementById('targetZ').value;
            if(x && z) socket.emit('goToCoordinates', { username: currentBot, x, y: y || 64, z });
        }

        function stopWalk() {
            if(currentBot) socket.emit('stopWalking', currentBot);
        }

        function requestRefreshInv() {
            if(currentBot) socket.emit('requestInventory', currentBot);
        }

        socket.on('log', (msg) => {
            const l = document.getElementById('logs');
            l.innerHTML += `<div>${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        });

        socket.on('chat', (msg) => {
            const l = document.getElementById('logs');
            l.innerHTML += `<div style="color:#fff;">${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        });

        socket.on('botListUpdate', (bots) => {
            if(bots.some(b => b.username === currentBot)) {
                document.getElementById('connectionStatus').innerText = `● Bağlı (${currentBot})`;
                document.getElementById('connectionStatus').style.color = "#10b981";
            } else {
                document.getElementById('connectionStatus').innerText = "● Bağlı Değil";
                document.getElementById('connectionStatus').style.color = "#ef4444";
            }
        });

        socket.on('dataUpdate', (data) => {
            if(data.username !== currentBot) return;

            document.getElementById('hudPos').innerText = `X: ${data.botPos.x.toFixed(1)} | Y: ${data.botPos.y.toFixed(1)} | Z: ${data.botPos.z.toFixed(1)}`;
            document.getElementById('hudStats').innerText = `❤️ ${(data.health || 20).toFixed(0)} | 🍖 ${(data.food || 20).toFixed(0)}`;

            const pCont = document.getElementById('playersListContainer');
            pCont.innerHTML = '';
            if(data.players && data.players.length > 0) {
                data.players.forEach(p => {
                    pCont.innerHTML += `<div class="list-row"><span>🟢 ${p.username}</span></div>`;
                });
            } else {
                pCont.innerHTML = '<div style="text-align:center; color:#666; margin-top:30px;">Çevrimiçi oyuncu yok</div>';
            }
        });

        socket.on('playerInventoryUpdate', (data) => {
            if(data.username !== currentBot) return;
            const grid = document.getElementById('playerInvGrid');
            grid.innerHTML = '';
            const textureBaseUrl = "https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/items/";

            data.slots.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                if(item) {
                    slot.innerHTML = `
                        <img src="${textureBaseUrl}${item.name}.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <span style="display:none; font-size:7px; text-align:center; overflow:hidden;">${item.name}</span>
                        <span class="slot-cnt">${item.count > 1 ? item.count : ''}</span>
                    `;
                }
                slot.onclick = () => socket.emit('quickMoveItem', { username: currentBot, slotId: index });
                slot.oncontextmenu = (e) => { 
                    e.preventDefault(); 
                    if(confirm(`"${item ? item.name : 'Eşya'}" yere atılsın mı?`)) {
                        socket.emit('tossItem', { username: currentBot, slotId: index });
                    }
                };
                grid.appendChild(slot);
            });
        });

        socket.on('mcGuiOpened', (data) => {
            if(data.username !== currentBot) return;
            document.getElementById('mcGuiContainer').style.display = 'block';
            document.getElementById('mcGuiTitle').innerText = data.title;
            const grid = document.getElementById('mcGuiGrid');
            grid.innerHTML = '';
            const textureBaseUrl = "https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/items/";

            data.items.forEach((item) => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                if(item) {
                    slot.innerHTML = `
                        <img src="${textureBaseUrl}${item.name}.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <span style="display:none; font-size:7px; text-align:center; overflow:hidden;">${item.name}</span>
                        <span class="slot-cnt">${item.count > 1 ? item.count : ''}</span>
                    `;
                    slot.onclick = () => socket.emit('clickMcItem', { username: currentBot, slotId: item.slot });
                }
                grid.appendChild(slot);
            });
        });
    </script>
</body>
</html>
